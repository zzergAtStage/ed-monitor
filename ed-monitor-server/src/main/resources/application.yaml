server:
  # Kept off well-known dev ports (8080/8081/8888/9090 etc.) to avoid clashing with other
  # local projects. ServerLifecycleService overrides this at launch anyway when it auto-starts
  # the backend, but this is the port used by a manual `spring-boot:run`.
  port: 50080

spring:
  application:
    name: ed-monitor-server
  jpa:
    hibernate:
      ddl-auto: update
  profiles:
    active: dev  # Default profile for this branch

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      status:
        http-mapping:
          degraded: 503
  info:
    env:
      enabled: true

# Exposed via /actuator/info so ed-monitor-swing's ServerLifecycleService can tell this apart
# from an unrelated Spring Boot app that happens to be occupying the same port.
info:
  app:
    name: ${spring.application.name}
