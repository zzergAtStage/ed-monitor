# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
      - "*.*.*"
  pull_request:
    branches: [ "master" ]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2048m'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven

    - name: Build and test with Maven
      run: mvn clean verify -B -ntp

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/target/surefire-reports/'
        retention-days: 30

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: '**/target/*.jar'
        retention-days: 7

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v4
      if: always()

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') && github.ref_type == 'tag'
    
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven

    - name: Build for release
      run: mvn clean package -DskipTests -B -ntp

    - name: Get release version
      id: version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace '^refs/tags/', ''
        "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Package self-contained Windows distribution (bundled JRE)
      shell: pwsh
      run: ./scripts/package-release.ps1 -Version "${{ steps.version.outputs.VERSION }}" -JdkHome "$env:JAVA_HOME"

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        draft: true
        prerelease: false
        artifacts: 'dist/ed-monitor-*-windows-x64.zip'
        artifactErrorsFailBuild: true
        generateReleaseNotes: true
